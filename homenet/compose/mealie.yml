version: "3.1"
services:
  mealie:
    container_name: mealie
    image: hkotel/mealie:latest
    restart: always
    ports:
      - 9925:80
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/New_York
    volumes:
      - /automation/docker/mealie:/app/data
    networks: 
      - dockernet
networks: 
  dockernet: 
    external: true
