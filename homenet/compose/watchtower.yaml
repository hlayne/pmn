version: "3" 
services: 
  watchtower:     
    image: containrrr/watchtower
    container_name: watchtower 
    restart: always 
    environment: 
      WATCHTOWER_SCHEDULE: "0 0 1 * * *" 
      TZ: America/New_York 
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_CLEANUP: "true" 
      WATCHTOWER_DEBUG: "true"      
      WATCHTOWER_NOTIFICATIONS: "email" 
      WATCHTOWER_NOTIFICATION_EMAIL_FROM: "bocaspbx@gmail.com"
      WATCHTOWER_NOTIFICATION_EMAIL_TO: "hlayne@gmail.com" 
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER: "smtp.gmail.com" 
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT: "587" 
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER: "bocaspbx@gmail.com"
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD: "pmrkjpbloapcdkaf"
      WATCHTOWER_NOTIFICATION_EMAIL_DELAY: "30"
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock
    networks: 
      - dockernet
networks:
  dockernet:
    external: true 
