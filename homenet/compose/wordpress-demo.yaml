services:
  db:
    # We use a mariadb image which supports both amd64 & arm64 architecture
    image: mariadb:10.6.4-focal
    # If you really want to use MySQL, uncomment the following line
    #image: mysql:8.0.27
    container_name: wordpress-demo-db
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - /automation/docker/wordpress/demo/db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=somewordpress
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=wordpress
    expose:
      - 3306
      - 33060
    networks: 
      - dockernet
  wordpress:
    image: wordpress:latest
    volumes:
      - /automation/docker/wordpress/demo/wp_data:/var/www/html
    ports:
      - 8089:8089
    container_name: wordpress-demo-main
    restart: always
    environment:
      - WORDPRESS_DB_HOST=wordpress-demo-db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
    networks: 
      - dockernet
networks: 
  dockernet: 
    external: true
