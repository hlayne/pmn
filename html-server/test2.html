<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Options Tracker</h2>

<table>
    <thead>
        <tr>
            <th>Option</th>
            <th>Strike Price</th>
            <th>Expiration Date</th>
            <th>Current Price</th>
            <th>Open Interest</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Call Option 1</td>
            <td>XYZ $100</td>
            <td>2023-01-01</td>
            <td>$5.00</td>
            <td>1000</td>
        </tr>
        <tr>
            <td>Put Option 1</td>
            <td>ABC $50</td>
            <td>2023-01-15</td>
            <td>$2.50</td>
            <td>500</td>
        </tr>
        <!-- Add more rows as needed -->
    </tbody>
</table>

</body>
</html>
