version: "3.5"
services:
  glances:
    container_name: glances
    image: hlayne/glances:1.0
    restart: unless-stopped
    pid: host
    ports:
      - 61208:61208
    environment:
      - TZ=Americas/New_York
      - GLANCES_OPT=--webserver
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /automation/docker/glances/data:/glances/conf
    labels:
      - homepage.group=CPLAB
      - homepage.name=Glances
      - homepage.icon=glances.png
      - homepage.href=http://cplab-glances.laynesystems.com/
      - homepage.description=Server Performance
    networks: 
      - dockernet
networks: 
  dockernet: 
    external: true
