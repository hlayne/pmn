services:
  firefox:
    image: ghcr.io/linuxserver/firefox
    container_name: firefox
    environment:
      - PUID=1000 #change this to for your settings
      - PGID=1000 #change this to for your settings
      - TZ=America/New_York  #change this to for your location
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: 
      - dockernet
    volumes:
      - /automation/docker/firefox/config:/config
    ports:
      - 127.0.0.1:3000:3000
    shm_size: "1gb"
    restart: unless-stopped
    labels:
      - homepage.group=HOMELAB
      - homepage.name=Firefox
      - homepage.icon=firefox.png
      - homepage.href=http://homelab-firefox.laynesystems.com/
      - homepage.description=Web browser
networks: 
  dockernet: 
    external: true