services:
    speedtest-tracker:
        container_name: speedtest-tracker
        ports:
            - 127.0.0.1:8085:80
            - 127.0.0.1:8443:443
        environment:
            - PUID=1000
            - PGID=1000
        volumes:
            - '/automation/docker/speedtest-tracker:/config'
        image: 'ghcr.io/alexjustesen/speedtest-tracker:latest'
        restart: unless-stopped
        networks: 
          - dockernet
networks: 
  dockernet: 
    external: true