services:
    uptime-kuma:
        image: louislam/uptime-kuma:latest
        container_name: uptime-kuma
        restart: always
        ports:
            - 127.0.0.1:3001:3001
        volumes:
            - /automation/docker/uptime-kuma/data:/app/data
            - /var/run/docker.sock:/var/run/docker.sock
        networks: 
          - dockernet
networks:
  dockernet:
    external: true 
  