version: '3.8'
services:
  app:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - 80:80 # 127.0.0.1 will only allow internal local access
      - 127.0.0.1:81:81 # 127.0.0.1 will only allow internal local access
      - 443:443
    volumes:
      - /automation/docker/data:/data
      - /automation/docker/letsencrypt:/etc/letsencrypt
    networks:
      - dockernet
networks: 
  dockernet: 
    external: true
    #currently not being deployed. Use cloudflared
