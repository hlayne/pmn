services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /automation/docker/portainer/config:/data
    ports:
      - 127.0.0.1:9443:9443
      - 127.0.0.1:9000:9000
      - 127.0.0.1:8000:8000
    networks:
      - dockernet
networks:
  dockernet:
    external: true
