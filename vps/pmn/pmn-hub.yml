version: "3.9"

name: layne-pmn-hub

services:
  wireguard:
    image: ghcr.io/linuxserver/wireguard:latest
    container_name: pmn-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=${SERVERURL}
      - SERVERPORT=51820
      - PEERS=0
      - PEERDNS=10.10.0.1
      - INTERNAL_SUBNET=10.10.0.0
    ports:
      - "51820:51820/udp"
    volumes:
      - /automation/docker/pmn/wireguard:/config
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      - pmn_net

  api:
    image: ghcr.io/hlayne/pmn:latest
    container_name: pmn-api
    restart: unless-stopped
    depends_on:
      - wireguard
    environment:
      - WG_CONF_PATH=/config/wg0.conf
      - WG_INTERFACE=wg0
      - HUB_ENDPOINT=${HUB_ENDPOINT}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - DATABASE_URL=sqlite:////data/pmn.db
      - ALLOWED_SUBNET=10.10.0.0/24
      - DNS_IP=10.10.0.1
      - TZ=${TZ}
    volumes:
      - /automation/docker/pmn/wireguard:/config
      - /automation/docker/pmn/db:/data
    expose:
      - "8080"
    networks:
      - pmn_net

networks:
  pmn_net:
    driver: bridge
